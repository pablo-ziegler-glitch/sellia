<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 180" role="img" aria-label="FLOKI">
  <defs>
    <linearGradient id="gold" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#F2CC6B"/>
      <stop offset="35%"  stop-color="#C9A227"/>
      <stop offset="100%" stop-color="#7A5A0A"/>
    </linearGradient>
    <linearGradient id="bg" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%"   stop-color="#181A22"/>
      <stop offset="100%" stop-color="#0D0F1A"/>
    </linearGradient>
    <radialGradient id="centerGlow" cx="50%" cy="55%" r="45%">
      <stop offset="0%"   stop-color="#C9A227" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#0D0F1A" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="360" height="180" fill="url(#bg)" rx="12"/>

  <!-- Subtle radial glow behind text -->
  <rect width="360" height="180" fill="url(#centerGlow)" rx="12"/>

  <!-- FLOKI text — "FLOK" + custom I with arrow -->
  <text
    x="28" y="128"
    font-family="'Arial Black','Arial Bold',Impact,sans-serif"
    font-weight="900"
    font-size="100"
    fill="url(#gold)"
    filter="url(#glow)"
    letter-spacing="4">FLOK</text>

  <!-- I stem (positioned after FLOK) -->
  <rect x="307" y="40" width="18" height="88" rx="3" fill="url(#gold)" filter="url(#glow)"/>

  <!-- Arrow / triangle on top of I pointing upper-right -->
  <polygon points="296,44  320,44  320,18" fill="url(#gold)" filter="url(#glow)"/>
</svg>
