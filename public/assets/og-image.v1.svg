<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="FLOKI — Explora. Compra. Vende.">
  <defs>
    <linearGradient id="gold" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#F2CC6B"/>
      <stop offset="35%"  stop-color="#C9A227"/>
      <stop offset="100%" stop-color="#7A5A0A"/>
    </linearGradient>
    <linearGradient id="bg" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%"   stop-color="#181A22"/>
      <stop offset="100%" stop-color="#0D0F1A"/>
    </linearGradient>
    <radialGradient id="centerGlow" cx="50%" cy="50%" r="40%">
      <stop offset="0%"   stop-color="#C9A227" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#0D0F1A" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="10" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#centerGlow)"/>

  <!-- FLOK text -->
  <text
    x="148" y="380"
    font-family="'Arial Black','Arial Bold',Impact,sans-serif"
    font-weight="900"
    font-size="260"
    fill="url(#gold)"
    filter="url(#glow)"
    letter-spacing="10">FLOK</text>

  <!-- I stem -->
  <rect x="952" y="130" width="48" height="250" rx="6" fill="url(#gold)" filter="url(#glow)"/>

  <!-- Arrow on top of I -->
  <polygon points="928,148  1004,148  1004,80" fill="url(#gold)" filter="url(#glow)"/>

  <!-- Tagline -->
  <text y="468" x="600" text-anchor="middle"
    font-family="'Arial','Helvetica',sans-serif"
    font-size="46" font-weight="400" letter-spacing="2">
    <tspan fill="#FFFFFF">Explora. </tspan><tspan fill="#C9A227" filter="url(#glow)">Compra.</tspan><tspan fill="#FFFFFF"> Vende.</tspan>
  </text>
</svg>
